[project]
name = "agc"
version = "0.0.1"
description = "Agentic compiler for AMD CDNA4 (gfx950): HIP or tensor programs in, directly emitted, verified and measured assembly out."
requires-python = ">=3.12"
dependencies = ["numpy>=2", "ml_dtypes>=0.5", "pyyaml>=6", "jsonschema>=4", "mcp>=1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "pytest-xdist>=3.8"]

[project.scripts]
agc = "agc.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agc*"]

[tool.setuptools.package-data]
agc = ["arch/*.yaml", "isa/*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs an AMD gfx950 GPU and ROCm"]
